const consent = {

let demographics_data = {};

const demographics = {
  type: jsPsychHtmlButtonResponse,
  stimulus: `
  <div style="width:800px;margin:40px auto;text-align:left;font-size:18px;line-height:1.6;">

  <p><strong>Before you get started, please provide the following demographic information:</strong></p>

  <p>
  1. What is your age in years?<br>
  <input id="age" type="number" min="0" max="120" style="margin-top:8px;">
  </p>

  <p>
  2. How do you describe your gender?<br>
  <label><input type="radio" name="gender" value="Man/male"> Man/male</label><br>
  <label><input type="radio" name="gender" value="Woman/female"> Woman/female</label><br>
  <label><input type="radio" name="gender" value="Non-binary"> Non-binary</label><br>
  <label>
    <input type="radio" name="gender" value="Different term"> I use a different term:
    <input id="gender_other" type="text" placeholder="Please specify">
  </label><br>
  <label><input type="radio" name="gender" value="Prefer not to answer"> Prefer not to answer</label>
  </p>

  </div>
  `,
  choices: ["Continue"],

  on_load: function(){
    const radios = document.querySelectorAll('input[name="gender"]');
    const otherBox = document.getElementById("gender_other");

    otherBox.disabled = true;

    radios.forEach(radio => {
      radio.addEventListener("change", function(){
        if(this.value === "Different term"){
          otherBox.disabled = false;
          otherBox.focus();
        } else {
          otherBox.disabled = true;
          otherBox.value = "";
        }
      });
    });

    // 🔥 CAPTURE BEFORE FINISH
    const button = document.querySelector(".jspsych-btn");

    button.addEventListener("click", function(){

      const ageEl = document.getElementById("age");
      const genderEl = document.querySelector('input[name="gender"]:checked');
      const genderOtherEl = document.getElementById("gender_other");

      demographics_data = {
        age: ageEl ? ageEl.value : "",
        gender: genderEl ? genderEl.value : "",
        gender_other: genderOtherEl ? genderOtherEl.value : ""
      };

    });

  },

  on_finish: function(data){

    // 🔥 attach to dataset
    data.age = demographics_data.age;
    data.gender = demographics_data.gender;
    data.gender_other = demographics_data.gender_other;

    // 🔥 ALSO attach globally (optional but useful)
    jsPsych.data.addProperties(demographics_data);

  }
};

/////////////////////////////////////////////////////////

const instructions1 = {

stimulus: `

</p>

on_load:function(){

let text=document.getElementById("continue-text");

text.innerHTML="Press the space bar to continue.";

jsPsych.pluginAPI.getKeyboardResponse({

/////////////////////////////////////////////////////////
//////////////// ENCODING TRIAL
/////////////////////////////////////////////////////////

const reset_encoding = {

    type: jsPsychCallFunction,

    func: function(){

        encodingNumbers = encodingNumbers2;
        encodingIndex = 0;

    }

};

const circle_trial = {

type: jsPsychHtmlKeyboardResponse,

stimulus: "",

choices: "NO_KEYS",

on_load: function(){

const display = jsPsych.getDisplayElement();

const circle = document.createElement("div");

circle.style.cssText = `
width:160px;
height:160px;
background:#DB6146;
border-radius:50%;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
cursor:pointer;
`;

display.appendChild(circle);

const startTime = performance.now();

let clicked = false;

circle.addEventListener("click", function(){

if(clicked) return;

clicked = true;

const rt = performance.now()-startTime;

const currentNumber = encodingNumbers[encodingIndex];

encodingIndex++;

circle.style.background="white";
circle.style.cursor="default";
circle.style.pointerEvents="none";

const numberDiv=document.createElement("div");

numberDiv.style.cssText=`
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:72px;
font-weight:bold;
color:black;
pointer-events:none;
`;

numberDiv.textContent=currentNumber;

display.appendChild(numberDiv);

setTimeout(function(){

circle.remove();
numberDiv.remove();

jsPsych.finishTrial({

phase:"encoding",

number_shown:currentNumber,

rt:rt,

condition:condition,

distribution:distributionType

});

},1000);

});

}

};

/////////////////////////////////////////////////////////
//////////////// RECONSTRUCTION TRIAL
/////////////////////////////////////////////////////////

const reset_reconstruction_counter = {

    type: jsPsychCallFunction,

    func: function () {
        reconstructionCount = 0;
    }

};

const reconstruction_trial = {

type: jsPsychHtmlKeyboardResponse,

choices:"NO_KEYS",

stimulus:function(){

return `

<div style="width:900px;margin:80px auto;text-align:center;">

<div style="font-size:22px;">
Click on the line to select a number.
</div>

<div style="font-size:30px;margin-top:25px;">
You have entered ${reconstructionCount} responses in this phase, out of a total of 10.
</div>

<div id="slider-track"

style="
width:650px;
height:6px;
background:#bbb;
margin:50px auto;
position:relative;
cursor:pointer;
">

<div id="slider-thumb"

style="
width:0;
height:0;
background:#666;
border-radius:50%;
position:absolute;
top:50%;
left:0%;
transform:translate(-50%,-50%);
">

</div>

</div>

<div id="slider-value"

style="font-size:48px;font-weight:bold;">

No number selected

</div>

<p style="margin-top:40px;">
Press SPACE to continue.
</p>

</div>

`;

},

on_load:function(){

const track=document.getElementById("slider-track");
const thumb=document.getElementById("slider-thumb");
const value=document.getElementById("slider-value");

let responseSelected=false;
let currentValue=null;
let dragging=false;

const min=15;
const max=34;

function updateSlider(clientX){

const rect=track.getBoundingClientRect();

const x=Math.max(0,
Math.min(rect.width,clientX-rect.left));

const proportion=x/rect.width;

const val=Math.round(min+proportion*(max-min));

const snapped=(val-min)/(max-min);

currentValue=val;

responseSelected=true;

thumb.style.width="22px";
thumb.style.height="22px";
thumb.style.left=`${snapped*100}%`;

value.innerHTML=val;

}

track.addEventListener("mousedown",function(e){

updateSlider(e.clientX);

dragging=true;

});

document.addEventListener("mousemove",function(e){

if(dragging){

updateSlider(e.clientX);

}

});

document.addEventListener("mouseup",function(){

dragging=false;

});

const startTime=performance.now();

const kb=jsPsych.pluginAPI.getKeyboardResponse({

valid_responses:[" "],

persist:true,

callback_function:function(){

if(!responseSelected) return;

jsPsych.pluginAPI.cancelKeyboardResponse(kb);

const rt=performance.now()-startTime;

reconstructionCount++;

jsPsych.finishTrial({

phase:"reproduction",

reproduced_value:currentValue,

trial_number:reconstructionCount,

rt:rt,

condition:condition,

distribution:distributionType

});

}

});

}

};

/////////////////////////////////////////////////////////
//////////////// TIMELINES
/////////////////////////////////////////////////////////

const encoding_block1 = {

    timeline: [circle_trial],

    repetitions: 10

};

const encoding_block2 = {

    timeline: [circle_trial],

    repetitions: 10

};

const slider_block1 = {

timeline:[reconstruction_trial],

repetitions:10

};

const slider_block2 = {

timeline:[reconstruction_trial],

repetitions:10

};

/////////////////////////////////////////////////////////
//////////////// DEBRIEF
/////////////////////////////////////////////////////////

const debrief = {
  type: jsPsychHtmlButtonResponse,

  stimulus: `
  <div style="width:800px;margin:80px auto;text-align:left;font-size:18px;line-height:1.6;">

  <p>
  Thank you for participating in this study. Please read the below debriefing statement. <strong> To receive your compensation in Prolific, you must click the Complete Study button at the bottom of this screen. </strong>
  </p>

  <p>
  1. What are the research questions?
  </p>

  <p>
  How do explanations (e.g., about what kind of climate you are in) help/hinder learning of distributions (e.g., of a series of temperature measurements)?
  </p>

  <p>
  2. How does this study extend previous research on this topic?
  </p>

  <p>
  Previous research has examined the ability to learn features of complex distributions. Previous research has also examined the role of explanations in everyday decision-making and learning. Despite this, little research has yet examined whether participants' explanations of distributions they experience influences their understanding of these distributions, either by helping them to generate a coherent interpretation of the distribution, or (if the explanation and experience do not match) by impairing such an interpretation. 
  </p>

  <p>
  3. What are some potential real-world implications of this research?
  </p>

  <p>
  Explanations about important natural phenomena (e.g., climate change, pandemics) are commonplace in everyday life. This study aims to understand the psychological processes underlying how such explanations may affect our interpretation of variable experiences (such as a series of days with different temperatures, infection rates in our local communities). 
  </p>

  <p>
  4. Briefly describe a potential issue (e.g., ethical, practical) or limitation of the study (e.g., design, ecological validity)
  </p>

  <p>
  A potential limitation of this study is its ecological validity; experiences of probability outcomes in the real world are significantly more varied and unpredictable than a simplified distributions used in our study. 
  </p>

  <p>
  5. Briefly describe the study methodology (e.g., design, dependent/ independent variables, materials).
  </p>

  <p>
  This is a 3 (distribution: unimodal, bimodal, uniform) x 2 (explanation: "tropical" environment, "desert" environment) between-subjects study measuring participants' ability to reproduce distributions that they have experienced. All participants are exposed to a series of 100 numbers which is either unimodal (i.e., includes a set of numbers that are more likely than others), bimodal (i.e., includes two sets of numbers that are more likely than others), or uniform (i.e., every number is equally likely to appear) in structure, then asked to reproduce it. Participants are told that these numbers represent a series of temperature measurements which come either from a tropical environment (where temperature measurements are generally unimodal) or a desert environment (where they are normally bimodal). The key measure is the extent to which reproduced distributions map onto the original distributions. 
  </p>

  <p>
  6. Further reading (i.e., a reference to a reading/s related to the current study for those curious).
  </p>

  <p>
  Mason, A., Szollosi, A., & Newell, B. R. (2025). Learning the Lie of the Land: How People Construct Mental Representations of Distributions. Journal of Experimental Psychology. Learning, Memory, and Cognition, 51(4), 515,525. https://doi.org/10.1037/xlm0001402
  </p>

  </div>
  `,

  choices: ["Complete study"],


  on_finish: function(){

  let data = jsPsych.data.get().csv();

  fetch("./php/save_data.php", {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: "data=" + encodeURIComponent(data)
  })
  .then(() => {

    /////////////////////////////////////////////////////
    //// PROLIFIC COMPLETION REDIRECT
    /////////////////////////////////////////////////////

    window.location.href =
      "./php/complete.php";

  })
  .catch(() => {

    /////////////////////////////////////////////////////
    //// STILL REDIRECT EVEN IF SAVE FAILS
    /////////////////////////////////////////////////////

    window.location.href =
      "./php/complete.php";

  });

}
};

/////////////////////////////////////////////////////////
//////////////// MAIN TIMELINE
/////////////////////////////////////////////////////////

jsPsych.run([

    consent,
    demographics,

    instructions1,
    encoding_block1,

    instructions2,
    slider_block1, 

    reset_encoding,
    reset_reconstruction_counter, 
    instructions3,
    encoding_block2,

    instructions4,
    slider_block2,

    debrief

]);

</script>
